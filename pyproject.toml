[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chasm-significance-of-changes"
version = "0.1.0"
description = "Change-point Hypothesis Assessment for Significance in Multivariate data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=5",
    "lmoments3>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
simulations = [
    "matplotlib>=3.7",
    "tqdm>=4.65",
]
notebooks = [
    "ipykernel>=6.25",
    "jupyter>=1.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
